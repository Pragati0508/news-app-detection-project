<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      background: #333;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .search-container {
      margin: 20px;
    }

    input {
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .news-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .news-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .news-card img {
      max-width: 100%;
      border-radius: 10px;
    }

    .news-card h3 {
      font-size: 18px;
      margin: 10px 0;
    }

    .news-card p {
      font-size: 14px;
      color: #555;
    }

    .news-card a {
      display: inline-block;
      margin-top: 10px;
      color: #007BFF;
      text-decoration: none;
    }

    .news-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Latest News</h1>
  <div class="search-container">
    <input type="text" id="keyword" placeholder="Enter keyword (e.g. technology)">
    <button onclick="getNews()">Get News</button>
  </div>
  <div class="news-container" id="news"></div>

  <script>
    async function getNews() {
      const keyword = document.getElementById('keyword').value.trim();
      const apiKey = '747fd35ba4b745e288482ad4eb9d2f83';
      const url = `https://newsapi.org/v2/everything?q=${keyword || 'latest'}&apiKey=${apiKey}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("Failed to fetch news");
        }
        const data = await response.json();
        const articles = data.articles;

        if (articles.length === 0) {
          document.getElementById('news').innerHTML = '<p>No news found for this keyword.</p>';
          return;
        }

        document.getElementById('news').innerHTML = articles
          .slice(0, 10)
          .map(article => `
            <div class="news-card">
              <img src="${article.urlToImage || 'https://via.placeholder.com/300x200'}" alt="News Image">
              <h3>${article.title}</h3>
              <p>${article.description || 'No description available.'}</p>
              <a href="${article.url}" target="_blank">Read more</a>
            </div>
          `).join('');
      } catch (error) {
        document.getElementById('news').innerHTML = `<p style="color: red;">${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
