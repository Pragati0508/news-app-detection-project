<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #6dd5fa, #2980b9);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    .weather-container {
      margin-top: 100px;
    }

    input {
      padding: 10px;
      width: 200px;
      border: none;
      border-radius: 5px;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #2ecc71;
    }

    #result {
      margin-top: 20px;
      font-size: 1.5em;
    }
  </style>
</head>
<body>
  <div class="weather-container">
    <h1>Weather Checker</h1>
    <input type="text" id="location" placeholder="Enter city name">
    <button onclick="getWeather()">Get Weather</button>
    <div id="result"></div>
  </div>

  <script>
    async function getWeather() {
      const location = document.getElementById('location').value.trim();
      if (!location) {
        document.getElementById('result').innerHTML = '<p style="color: yellow;">Please enter a city name</p>';
        return;
      }

      const apiKey = '94f6da04a47e4299a1460633250709';
      const url = `http://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${location}&aqi=yes`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("Location not found");
        }
        const data = await response.json();
        const temp = data.current.temp_c;
        const condition = data.current.condition.text;

        document.getElementById('result').innerHTML = `
          <p>Temperature in <strong>${data.location.name}</strong>: ${temp}°C</p>
          <p>Condition: ${condition}</p>
        `;
      } catch (error) {
        document.getElementById('result').innerHTML = `<p style="color: yellow;">${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
